<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <title>UniBlueprint</title>
    <meta name="description" content="The structure behind your success — Ireland's student platform." />
    <meta name="author" content="UniBlueprint" />
    <!-- Organisation structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "UniBlueprint",
      "url": "https://uniblueprint.ie",
      "logo": "https://uniblueprint.ie/og-image.png",
      "description": "The all-in-one platform for Irish students — Foundation Blueprint, Elevation Blueprint, Campus Connect, and more.",
      "foundingLocation": { "@type": "Country", "name": "Ireland" },
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "UniBlueprint",
      "url": "https://uniblueprint.ie",
      "potentialAction": {
        "@type": "SearchAction",
        "target": { "@type": "EntryPoint", "urlTemplate": "https://uniblueprint.ie/blog?q={search_term_string}" },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
