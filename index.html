<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <title>Uniblueprint</title>
    <meta name="description" content="The structure behind your success — Ireland's student platform." />
    <meta name="author" content="Uniblueprint" />
    <!-- Organisation structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Uniblueprint",
      "url": "https://uniblueprint.com",
      "logo": "https://uniblueprint.com/og-image.png",
      "description": "The all-in-one platform for Irish students — Foundation Blueprint, Elevation Blueprint, Campus Connect, and more.",
      "foundingLocation": { "@type": "Country", "name": "Ireland" },
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Uniblueprint",
      "url": "https://uniblueprint.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": { "@type": "EntryPoint", "urlTemplate": "https://uniblueprint.com/blog?q={search_term_string}" },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- Conditional GA4 load — only fires after cookie consent -->
    <script>
      (function () {
        var GA_ID = 'GA_MEASUREMENT_ID'; // TODO: Replace with real GA4 measurement ID
        try {
          if (localStorage.getItem('ubp_cookie_consent') === 'accepted') {
            var s = document.createElement('script');
            s.id = 'ga-script';
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
            s.async = true;
            document.head.appendChild(s);
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { window.dataLayer.push(arguments); };
            window.gtag('js', new Date());
            window.gtag('config', GA_ID);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
