# Netlify build configuration for the website (the app/ directory is a
# separate Expo project, not part of this site — Netlify should only ever
# build from the repo root).
#
# The SPA fallback (serve index.html for every route) is already handled by
# public/_redirects, which Netlify picks up automatically — no [[redirects]]
# needed here as well.
#
# Environment variables to set in the Netlify dashboard (Site configuration
# → Environment variables), not here — these are read at build time by Vite
# and only VITE_STRIPE_PUBLISHABLE_KEY is safe to expose client-side:
#   VITE_SUPABASE_URL              = https://ozpeofkvnpikhopkgcxc.supabase.co
#   VITE_SUPABASE_ANON_KEY         = (from Supabase dashboard → Project Settings → API)
#   VITE_STRIPE_PUBLISHABLE_KEY    = pk_live_... (or pk_test_... while testing)
#
# Secret keys (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY) do
# NOT go here — those are Supabase Edge Function secrets, set via
# `supabase secrets set` or the Supabase dashboard, never exposed to the
# browser bundle.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
